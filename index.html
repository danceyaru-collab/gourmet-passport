<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MICHELIN GUIDE PASSPORT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      color: #333;
      padding: 20px 10px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* ヘッダー */
    header {
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .header-title-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      background: #e60012;
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 20px;
    }

    .title-text h1 {
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    .title-text span {
      font-size: 12px;
      color: #666;
    }

    .title-text span strong {
      color: #e60012;
    }

    .header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .progress-bar-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f0f2f5;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }

    .progress-rate {
      color: #e60012;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s;
    }

    .btn-primary {
      background: #e60012;
      color: white;
    }

    .btn-primary:hover {
      background: #cc0010;
    }

    .btn-secondary {
      background: #eef2f5;
      color: #4a5568;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .btn-save {
      background: #3182ce;
      color: white;
      border-radius: 6px;
      padding: 6px 12px;
    }

    .btn-delete {
      background: #e53e3e;
      color: white;
      border-radius: 6px;
      padding: 6px 12px;
    }

    /* フィルターエリア */
    .filter-section {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab-btn {
      padding: 6px 14px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      background: white;
      color: #4a5568;
      font-size: 13px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #2d3748;
      color: white;
      border-color: #2d3748;
    }

    .search-input {
      width: 100%;
      padding: 10px 15px;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      background: #f8fafc;
      font-size: 14px;
    }

    /* 店舗一覧（グリッド表示） */
    .store-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 15px;
    }

    .store-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid #edf2f7;
      display: flex;
      flex-direction: column;
    }

    .store-image-container {
      width: 100%;
      height: 160px;
      overflow: hidden;
      background-color: #f7fafc;
    }

    .store-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .store-info {
      padding: 15px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .category-badge {
      display: inline-block;
      font-size: 11px;
      background: #edf2f7;
      color: #4a5568;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      align-self: flex-start;
    }

    .store-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .store-detail {
      font-size: 12px;
      color: #718096;
      margin-bottom: 4px;
    }

    /* モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      padding: 20px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #a0aec0;
    }

    .add-category-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .add-category-box input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
    }

    .category-item {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }

    .category-item input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title-area">
      <div class="logo-icon">🍴</div>
      <div class="title-text">
        <h1>MICHELIN GUIDE PASSPORT</h1>
        <span>SPECIAL SELECTION: <strong>Kanji & Saya</strong></span>
      </div>
    </div>
    <div class="header-actions">
      <div class="progress-bar-container">
        制覇率 <span id="progressRate" class="progress-rate">0 / 0</span>
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="openCategoryModal()">🏷️ カテゴリー管理</button>
        <button class="btn btn-primary" onclick="openAddStoreModal()">＋ お店を追加</button>
      </div>
    </div>
  </header>

  <section class="filter-section">
    <div class="tabs" id="categoryTabs">
      </div>
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 店名やエリアで検索..." oninput="renderStores()">
  </section>

  <main class="store-list" id="storeList">
    </main>

  <div class="modal-overlay" id="categoryModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🏷️ カテゴリーの追加・管理</h3>
        <button class="close-btn" onclick="closeCategoryModal()">✕</button>
      </div>
      
      <div class="add-category-box">
        <input type="text" id="newCategoryInput" placeholder="新しいカテゴリー名（例: カフェ）">
        <button class="btn btn-primary" onclick="addCategory()">追加</button>
      </div>

      <h4>現在設定されているカテゴリー</h4>
      <div id="categoryEditList" style="margin-top: 10px;">
        </div>

      <div style="text-align: right; margin-top: 20px;">
        <button class="btn btn-secondary" onclick="closeCategoryModal()">閉じる</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="addStoreModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>＋ お店を追加</h3>
        <button class="close-btn" onclick="closeAddStoreModal()">✕</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <input type="text" id="storeNameInput" class="search-input" placeholder="店名">
        <select id="storeCategorySelect" class="search-input">
          </select>
        <input type="text" id="storeAddressInput" class="search-input" placeholder="住所・エリア">
        <input type="text" id="storePhoneInput" class="search-input" placeholder="電話番号">
        <button class="btn btn-primary" style="justify-content: center; padding: 10px;" onclick="addStore()">登録する</button>
      </div>
    </div>
  </div>

  <script>
    // --- 初期データ ---
    let categories = JSON.parse(localStorage.getItem('gourmet_categories')) || [
      "おさやの最近ガチ行きたいお店",
      "貫路が行きたいお店",
      "大将軍が今行きたいイタリアン5選",
      "大将軍が今行きたいフレンチ",
      "和食・その他"
    ];

    let stores = JSON.parse(localStorage.getItem('gourmet_stores')) || [
      { id: 1, name: "レストラン ナズ", category: "大将軍が今行きたいフレンチ", address: "長野県北佐久郡軽井沢町追分138-1", phone: "0267-46-8840", visited: false },
      { id: 2, name: "アマラントス", category: "大将軍が今行きたいフレンチ", address: "東京都中央区銀座5-6-7 SANWA すずらん Bldg. 9F", phone: "050-5596-4560", visited: false },
      { id: 3, name: "モノリス", category: "大将軍が今行きたいフレンチ", address: "東京都渋谷区渋谷2-6-1 ウィンド渋谷 1F", phone: "050-5595-1221", visited: false },
      { id: 4, name: "sio", category: "大将軍が今行きたいフレンチ", address: "東京都渋谷区上原1-35-3", phone: "03-6804-7607", visited: false },
      { id: 5, name: "プレヴァナンス", category: "大将軍が今行きたいフレンチ", address: "東京都港区南青山2-13-7 マトリス 1F", phone: "050-5590-5273", visited: false },
      { id: 6, name: "渡辺料理店", category: "大将軍が今行きたいフレンチ", address: "東京都江東区富岡1-2-9 1F", phone: "03-6381-8899", visited: false },
      { id: 7, name: "マダム・トキ", category: "大将軍が今行きたいフレンチ", address: "東京都渋谷区鉢山町14-7", phone: "03-3461-2263", visited: false }
    ];

    let currentFilter = "すべて";

    // --- フレンチ用内観画像設定 ---
    const frenchInteriorImage = "image_16.png"; // 添付画像のファイル名に変更

    // 店舗情報に基づいて画像urlを決定する関数
    function getStoreImageUrl(store) {
      const categoryName = store.category || "";
      // カテゴリー名に「フレンチ」または「フランス」が含まれているか判定
      const isFrench = categoryName.includes("フレンチ") || categoryName.includes("フランス");

      // フレンチの場合は指定の内観画像を表示
      if (isFrench) {
        return frenchInteriorImage;
      }
      // それ以外で画像が設定されていればそれを返す
      return store.imageUrl || null;
    }

    // --- 描画処理 ---
    function saveAndRender() {
      localStorage.setItem('gourmet_categories', JSON.stringify(categories));
      localStorage.setItem('gourmet_stores', JSON.stringify(stores));
      renderTabs();
      renderStores();
      updateProgress();
    }

    function renderTabs() {
      const tabsContainer = document.getElementById('categoryTabs');
      const selectContainer = document.getElementById('storeCategorySelect');
      
      const allFilters = ["すべて", "訪問済み", "未訪問", ...categories];

      tabsContainer.innerHTML = allFilters.map(filter => `
        <button class="tab-btn ${currentFilter === filter ? 'active' : ''}" onclick="setFilter('${filter}')">
          ${filter}
        </button>
      `).join('');

      selectContainer.innerHTML = categories.map(cat => `
        <option value="${cat}">${cat}</option>
      `).join('');
    }

    function setFilter(filterName) {
      currentFilter = filterName;
      renderTabs();
      renderStores();
    }

    function renderStores() {
      const storeList = document.getElementById('storeList');
      const searchText = document.getElementById('searchInput').value.toLowerCase();

      const filteredStores = stores.filter(store => {
        let matchFilter = false;
        if (currentFilter === "すべて") matchFilter = true;
        else if (currentFilter === "訪問済み") matchFilter = store.visited;
        else if (currentFilter === "未訪問") matchFilter = !store.visited;
        else matchFilter = store.category === currentFilter;

        const matchSearch = store.name.toLowerCase().includes(searchText) || 
                            (store.address && store.address.toLowerCase().includes(searchText));

        return matchFilter && matchSearch;
      });

      if (filteredStores.length === 0) {
        storeList.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color: #a0aec0;">該当するお店がありません</div>`;
        return;
      }

      storeList.innerHTML = filteredStores.map(store => {
        // 店舗ごとの画像URLを取得
        const imageUrl = getStoreImageUrl(store);

        return `
          <div class="store-card">
            ${imageUrl ? `
              <div class="store-image-container">
                <img src="${imageUrl}" alt="${store.name}" class="store-image" />
              </div>
            ` : ''}
            <div class="store-info">
              <span class="category-badge">${store.category}</span>
              <div class="store-name">${store.name}</div>
              ${store.address ? `<div class="store-detail">📍 ${store.address}</div>` : ''}
              ${store.phone ? `<div class="store-detail">📞 ${store.phone}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function updateProgress() {
      const visitedCount = stores.filter(s => s.visited).length;
      document.getElementById('progressRate').innerText = `${visitedCount} / ${stores.length}`;
    }

    // --- カテゴリー管理モーダル ---
    function openCategoryModal() {
      renderCategoryEditList();
      document.getElementById('categoryModal').classList.add('active');
    }

    function closeCategoryModal() {
      document.getElementById('categoryModal').classList.remove('active');
    }

    function renderCategoryEditList() {
      const container = document.getElementById('categoryEditList');
      container.innerHTML = categories.map((cat, index) => `
        <div class="category-item">
          <input type="text" id="cat-input-${index}" value="${cat}">
          <button class="btn btn-save" onclick="updateCategory(${index})">保存</button>
          <button class="btn btn-delete" onclick="deleteCategory(${index})">削除</button>
        </div>
      `).join('');
    }

    function addCategory() {
      const input = document.getElementById('newCategoryInput');
      const val = input.value.trim();
      if (val && !categories.includes(val)) {
        categories.push(val);
        input.value = "";
        renderCategoryEditList();
        saveAndRender();
      }
    }

    function updateCategory(index) {
      const newName = document.getElementById(`cat-input-${index}`).value.trim();
      if (!newName) return;

      const oldName = categories[index];
      categories[index] = newName;

      stores.forEach(store => {
        if (store.category === oldName) {
          store.category = newName;
        }
      });

      if (currentFilter === oldName) currentFilter = newName;

      renderCategoryEditList();
      saveAndRender();
      alert("カテゴリー名を変更しました");
    }

    function deleteCategory(index) {
      if (confirm("このカテゴリーを削除しますか？")) {
        const deletedName = categories[index];
        categories.splice(index, 1);

        if (currentFilter === deletedName) currentFilter = "すべて";

        renderCategoryEditList();
        saveAndRender();
      }
    }

    // --- お店追加 ---
    function openAddStoreModal() {
      document.getElementById('addStoreModal').classList.add('active');
    }

    function closeAddStoreModal() {
      document.getElementById('addStoreModal').classList.remove('active');
    }

    function addStore() {
      const name = document.getElementById('storeNameInput').value.trim();
      const category = document.getElementById('storeCategorySelect').value;
      const address = document.getElementById('storeAddressInput').value.trim();
      const phone = document.getElementById('storePhoneInput').value.trim();

      if (!name) {
        alert("店名を入力してください");
        return;
      }

      stores.push({
        id: Date.now(),
        name,
        category,
        address,
        phone,
        visited: false
      });

      document.getElementById('storeNameInput').value = "";
      document.getElementById('storeAddressInput').value = "";
      document.getElementById('storePhoneInput').value = "";

      closeAddStoreModal();
      saveAndRender();
    }

    // 初期化
    saveAndRender();
  </script>
</body>
</html>
