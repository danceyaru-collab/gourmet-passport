<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MICHELIN GUIDE PASSPORT - Kanji & Saya</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        michelin: {
                            red: '#e21b23',
                            redhover: '#c4121a',
                            bg: '#f8f9fa',
                            card: '#ffffff',
                            text: '#2d3748',
                            subtext: '#718096',
                            border: '#e2e8f0'
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans JP', 'sans-serif'],
                        serif: ['Noto Serif JP', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f8f9fa; color: #2d3748; font-family: 'Noto Sans JP', sans-serif; }
        .michelin-card {
            background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); transition: all 0.25s ease;
        }
        .michelin-card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); border-color: #cbd5e0; }
        .filter-btn-active { background-color: #2d3748 !important; color: #ffffff !important; border-color: #2d3748 !important; }
    </style>
</head>
<body class="min-h-screen pb-16">

    <header class="border-b border-michelin-border bg-white sticky top-0 z-30 px-4 py-3 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-michelin-red flex items-center justify-center text-white shadow-sm">
                    <i class="fa-solid fa-utensils text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg md:text-xl tracking-tight text-gray-900">MICHELIN GUIDE PASSPORT</h1>
                    <p class="text-xs text-michelin-subtext">SPECIAL SELECTION: <span class="font-bold text-michelin-red">Kanji &amp; Saya</span></p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2.5">
                <div class="bg-gray-50 px-3.5 py-1.5 rounded-full border border-michelin-border flex items-center gap-3">
                    <span class="text-xs text-michelin-subtext font-medium">制覇率</span>
                    <span id="visitedCountText" class="text-sm font-bold text-michelin-red">0 / 0</span>
                    <div class="w-16 bg-gray-200 h-2 rounded-full overflow-hidden">
                        <div id="progressBar" class="bg-michelin-red h-full transition-all duration-500 w-0"></div>
                    </div>
                </div>

                <button onclick="openCategoryModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-full text-xs font-bold transition-all border border-gray-300 flex items-center gap-1">
                    <i class="fa-solid fa-tags text-gray-500"></i> カテゴリー管理
                </button>

                <button onclick="openAddRestaurantModal()" class="bg-michelin-red hover:bg-michelin-redhover text-white px-3.5 py-1.5 rounded-full text-xs font-bold transition-all shadow-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-plus"></i> <span>お店を追加</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-6">
        <div class="flex flex-col md:flex-row justify-between items-center gap-3 mb-6 bg-white p-3 rounded-xl border border-michelin-border shadow-sm">
            <div class="flex flex-wrap gap-1.5 justify-center" id="categoryFilterContainer"></div>
            <div class="relative w-full md:w-64">
                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                <input type="text" id="searchInput" oninput="renderGrid()" placeholder="店名やエリアで検索..." class="w-full bg-gray-50 border border-michelin-border rounded-full pl-8 pr-4 py-1.5 text-xs text-michelin-text placeholder-gray-400 focus:outline-none focus:border-michelin-red">
            </div>
        </div>

        <div id="restaurantGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
    </main>

    <div id="categoryModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white border border-michelin-border rounded-2xl max-w-md w-full p-6 relative text-michelin-text shadow-xl">
            <button onclick="closeModal('categoryModal')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
            <h2 class="text-lg font-bold font-serif text-gray-900 mb-3 border-b border-gray-100 pb-2"><i class="fa-solid fa-tags text-michelin-red mr-1.5"></i>カテゴリーの追加・管理</h2>
            <form onsubmit="addCategory(event)" class="flex gap-2 mb-4">
                <input type="text" id="newCategoryInput" required placeholder="新しいカテゴリー名（例: カフェ）" class="flex-1 bg-gray-50 border border-michelin-border rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-michelin-red">
                <button type="submit" class="bg-michelin-red hover:bg-michelin-redhover text-white px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap shadow-sm">追加</button>
            </form>
            <p class="text-[11px] text-michelin-subtext mb-2">現在設定されているカテゴリー</p>
            <div id="categoryListContainer" class="space-y-1.5 max-h-48 overflow-y-auto pr-1"></div>

            </div>
        </div>
    </div>

        <div class="bg-white border border-michelin-border rounded-2xl max-w-lg w-full p-6 relative text-michelin-text shadow-xl">
            <button onclick="closeModal('stampModal')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
            <div class="border-b border-gray-100 pb-4 mb-4">
                <span id="modalCategory" class="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-gray-100 text-michelin-red mb-1.5">カテゴリー</span>
                <h2 id="modalTitle" class="text-xl font-bold font-serif text-gray-900">店名</h2>
                <p id="modalAddress" class="text-xs text-michelin-subtext mt-1"><i class="fa-solid fa-location-dot text-michelin-red mr-1"></i>住所</p>
                <p id="modalTel" class="text-xs text-michelin-subtext mt-0.5"><i class="fa-solid fa-phone text-michelin-red mr-1"></i>電話番号</p>
                <a id="modalTabelog" href="#" target="_blank" class="inline-flex items-center text-xs text-michelin-red font-semibold hover:underline mt-2">
                    <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> 食べログで詳細を見る
                </a>
            </div>
            <form onsubmit="saveStamp(event)" class="space-y-4">
                <input type="hidden" id="modalRestaurantId">
                <div class="flex items-center justify-between bg-gray-50 p-3.5 rounded-xl border border-michelin-border">
                    <div class="flex items-center gap-2.5">
                        <i class="fa-solid fa-utensils text-lg text-michelin-red"></i>
                        <div>
                            <p class="font-bold text-xs text-gray-800">来店ステータス</p>
                            <p class="text-[10px] text-michelin-subtext">訪問済みの場合はスイッチをオン</p>
                        </div>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="modalVisited" class="sr-only peer" onchange="toggleVisitedUI()">
                        <div class="w-12 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-michelin-red"></div>
                    </label>
                </div>
                <div id="visitedFields" class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">来店日</label>
                        <input type="date" id="modalDate" class="w-full bg-gray-50 border border-michelin-border rounded-lg p-2 text-xs text-michelin-text focus:outline-none focus:border-michelin-red">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">美味しかった料理・ふたりのメモ</label>
                        <textarea id="modalNotes" rows="3" placeholder="おすすめ料理や感想を記録..." class="w-full bg-gray-50 border border-michelin-border rounded-lg p-2 text-xs text-michelin-text focus:outline-none focus:border-michelin-red"></textarea>
                    </div>
                </div>
                <div class="flex justify-between items-center pt-3 border-t border-gray-100">
                    <button type="button" onclick="deleteCustomRestaurant()" id="btnDeleteCustom" class="text-xs text-red-500 hover:underline hidden"><i class="fa-solid fa-trash mr-1"></i> 削除</button>
                    <div class="flex gap-2 ml-auto">
                        <button type="button" onclick="closeModal('stampModal')" class="px-3.5 py-1.5 rounded-lg border border-gray-300 text-gray-600 text-xs font-medium">キャンセル</button>
                        <button type="submit" class="px-4 py-1.5 rounded-lg bg-michelin-red text-white font-bold text-xs shadow-sm">保存する</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="addRestaurantModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white border border-michelin-border rounded-2xl max-w-lg w-full p-6 relative text-michelin-text shadow-xl">
            <button onclick="closeModal('addRestaurantModal')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl"><i class="fa-solid fa-xmark"></i></button>

            <form onsubmit="addNewRestaurant(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">店名 *</label>
                    <input type="text" id="addName" required placeholder="例: レストラン名" class="w-full bg-gray-50 border border-michelin-border rounded-lg p-2 text-xs focus:outline-none focus:border-michelin-red">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">カテゴリー *</label>
                    <select id="addCategory" class="w-full bg-gray-50 border border-michelin-border rounded-lg p-2 text-xs focus:outline-none focus:border-michelin-red"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">住所・エリア</label>
                    <input type="text" id="addAddress" placeholder="例: 東京都港区..." class="w-full bg-gray-50 border border-michelin-border rounded-lg p-2 text-xs focus:outline-none focus:border-michelin-red">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">電話番号</label>
                    <input type="text" id="addTel" placeholder="例: 03-XXXX-XXXX" class="w-full bg-gray-50 border border-michelin-border rounded-lg p-2 text-xs focus:outline-none focus:border-michelin-red">

                <div>

                    <input type="url" id="addTabelog" placeholder="https://tabelog.com/..." class="w-full bg-gray-50 border border-michelin-border rounded-lg p-2 text-xs focus:outline-none focus:border-michelin-red">
                </div>

                    <button type="button" onclick="closeModal('addRestaurantModal')" class="px-3.5 py-1.5 rounded-lg border border-gray-300 text-gray-600 text-xs font-medium">キャンセル</button>
                    <button type="submit" class="px-4 py-1.5 rounded-lg bg-michelin-red hover:bg-michelin-redhover text-white font-bold text-xs shadow-sm">追加する</button>
                </div>
            </form>
        </div>

        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCR2EdKtZYnnZxB6IawQT2cqe2KdECAmjY",
            authDomain: "gourmet-passport-f1953.firebaseapp.com",
            projectId: "gourmet-passport-f1953",
            storageBucket: "gourmet-passport-f1953.firebasestorage.app",
            messagingSenderId: "1040647092613",
            appId: "1:1040647092613:web:12ea90002b271d1983ecec"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const defaultCategories = ['おさや行きたいお店', '貫路が行きたいお店', 'イタリアン', 'フレンチ', '和食・その他'];
        const initialRestaurants = [
            { id: 1, name: "酒・肴「赤津庄兵衛」", category: "おさや行きたいお店", address: "東京都杉並区天沼3-11-3 モアビル102", tel: "050-5590-2987", tabelog: "https://tabelog.com/tokyo/A1319/A131906/13209982/" },
            { id: 2, name: "総本家更科堀井 本店", category: "おさや行きたいお店", address: "東京都港区元麻布3-11-4", tel: "03-3403-3401", tabelog: "https://tabelog.com/tokyo/A1307/A130702/13001226/" },
            { id: 3, name: "Wineshop & Diner FUJIMARU 浅草橋店", category: "おさや行きたいお店", address: "東京都中央区東日本橋2-27-19 Ｓビル 2F", tel: "050-5593-6109", tabelog: "https://tabelog.com/tokyo/A1311/A131103/13167076/" },
            { id: 4, name: "浅草橋ワインバル八十郎商店", category: "おさや行きたいお店", address: "東京都台東区浅草橋1-18-4", tel: "050-5600-4912", tabelog: "https://tabelog.com/tokyo/A1311/A131103/13284282/" },
            { id: 5, name: "屋根裏のパリ食堂", category: "おさや行きたいお店", address: "東京都目黒区青葉台1-17-2 青葉台117ビル 3F", tel: "050-5872-2297", tabelog: "https://tabelog.com/tokyo/A1317/A131701/13141729/" },
            { id: 6, name: "ポンテ デル ピアット", category: "イタリアン", address: "東京都渋谷区広尾5-19-7 協和ビル 1F", tel: "03-3473-0707", tabelog: "https://tabelog.com/tokyo/A1307/A130703/13166111/" },
            { id: 7, name: "アッピア 本店", category: "イタリアン", address: "東京都港区南麻布4-11-35 インペリアル広尾 B101", tel: "03-3444-5801", tabelog: "https://tabelog.com/tokyo/A1307/A130703/13001593/" },
            { id: 8, name: "リストランテ アクアパッツァ", category: "イタリアン", address: "東京都港区南青山2-27-18 青山エムズタワーパサージュ青山 2F", tel: "050-5869-3542", tabelog: "https://tabelog.com/tokyo/A1306/A130603/13004578/" },
            { id: 9, name: "トラットリア タンタボッカ", category: "イタリアン", address: "東京都渋谷区千駄ヶ谷4-5-1 ニュー外苑ハイツ 1F", tel: "050-3187-6924", tabelog: "https://tabelog.com/tokyo/A1304/A130403/13058484/" },
            { id: 10, name: "ラ・ベットラ・ダ・オチアイ", category: "イタリアン", address: "東京都中央区銀座1-21-2", tel: "03-3567-5656", tabelog: "https://tabelog.com/tokyo/A1313/A131301/13002504/" },
            { id: 11, name: "レストラン ナズ", category: "フレンチ", address: "長野県北佐久郡軽井沢町追分138-1", tel: "0267-46-8840", tabelog: "https://tabelog.com/nagano/A2003/A200301/20028578/" },
            { id: 12, name: "アマラントス", category: "フレンチ", address: "東京都中央区銀座5-6-7 SANWA すずらん Bldg.９F", tel: "050-5596-4560", tabelog: "https://tabelog.com/tokyo/A1301/A130101/13307700/" },
            { id: 13, name: "モノリス", category: "フレンチ", address: "東京都渋谷区渋谷2-6-1 ウィンド渋谷 1F", tel: "050-5595-1221", tabelog: "https://tabelog.com/tokyo/A1303/A130301/13108686/" },
            { id: 14, name: "sio", category: "フレンチ", address: "東京都渋谷区上原1-35-3", tel: "03-6804-7607", tabelog: "https://tabelog.com/tokyo/A1318/A131811/13150395/" },
            { id: 15, name: "プレヴナンス", category: "フレンチ", address: "東京都港区南青山2-13-7 マトリス 1F", tel: "050-5590-5273", tabelog: "https://tabelog.com/tokyo/A1306/A130603/13162493/" },
            { id: 16, name: "渡辺料理店", category: "フレンチ", address: "東京都江東区富岡1-2-9 1F", tel: "03-6381-8899", tabelog: "https://tabelog.com/tokyo/A1313/A131303/13274535/" },
            { id: 17, name: "マダム・トキ", category: "フレンチ", address: "東京都渋谷区鉢山町14-7", tel: "03-3461-2263", tabelog: "https://tabelog.com/tokyo/A1300/A130303/13001707/" }
        ];

        window.appState = {
            categoriesList: [...defaultCategories],
            customRestaurants: [...initialRestaurants],
            userUserData: {},
            currentFilter: 'all'
        };

        const docRef = doc(db, "appData", "shared");

        window.saveToCloud = async function() {
            try {
                await setDoc(docRef, {
                    categoriesList: window.appState.categoriesList,
                    customRestaurants: window.appState.customRestaurants,
                    userUserData: window.appState.userUserData
                });
            } catch (e) {
                console.error("Save error:", e);
            }
        };

        onSnapshot(docRef, async (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.customRestaurants && data.customRestaurants.length > 0) {
                    window.appState.categoriesList = data.categoriesList || [...defaultCategories];
                    window.appState.customRestaurants = data.customRestaurants;
                    window.appState.userUserData = data.userUserData || {};
                } else {
                    // データベースが空なら初期データを投入
                    await window.saveToCloud();
                }
            } else {
                // ドキュメントが存在しない場合も初期データを強制書き込み
                await window.saveToCloud();
            }
            window.renderCategoryButtons();
            window.updateAddCategorySelect();
            window.renderGrid();
            window.updateProgress();
        }, (error) => {
            console.error("Snapshot error:", error);
            // エラー時（権限エラー等）も画面だけは初期データで描画
            window.renderCategoryButtons();
            window.updateAddCategorySelect();
            window.renderGrid();
            window.updateProgress();
        });
    </script>

    <script>
        function getAllRestaurants() {
            return window.appState ? window.appState.customRestaurants : [];
        }

        function renderCategoryButtons() {
            const container = document.getElementById('categoryFilterContainer');
            const systemFilters = ['all', 'visited', 'unvisited'];
            const labelMap = { 'all': 'すべて', 'visited': '訪問済み', 'unvisited': '未訪問' };

            let html = systemFilters.map(cat => `
                <button onclick="setFilter('${cat}')" id="btn-${cat}" class="filter-btn px-3 py-1 rounded-full text-xs font-semibold border border-michelin-border bg-gray-50 text-gray-700 hover:bg-gray-100 transition-all">
                    ${labelMap[cat]}
                </button>
            `).join('');

            const cats = window.appState ? window.appState.categoriesList : [];
            html += cats.map(cat => `
                <button onclick="setFilter('${cat}')" id="btn-${cat}" class="filter-btn px-3 py-1 rounded-full text-xs font-semibold border border-michelin-border bg-gray-50 text-gray-700 hover:bg-gray-100 transition-all">
                    ${cat}
                </button>
            `).join('');

            container.innerHTML = html;
            setFilter(window.appState ? window.appState.currentFilter : 'all');
        }

        function updateAddCategorySelect() {
            const select = document.getElementById('addCategory');
            const cats = window.appState ? window.appState.categoriesList : [];
            select.innerHTML = cats.map(cat => `<option value="${cat}">${cat}</option>`).join('');
        }

        function renderGrid() {
            const grid = document.getElementById('restaurantGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const allRestaurants = getAllRestaurants();
            const currentFilter = window.appState ? window.appState.currentFilter : 'all';
            const userUserData = window.appState ? window.appState.userUserData : {};

            const filtered = allRestaurants.filter(r => {
                const userData = userUserData[r.id] || {};
                const isVisited = !!userData.visited;

                if (currentFilter !== 'all' && currentFilter !== 'visited' && currentFilter !== 'unvisited') {
                    if (r.category !== currentFilter) return false;
                }
                if (currentFilter === 'visited' && !isVisited) return false;
                if (currentFilter === 'unvisited' && isVisited) return false;

                if (searchVal) {
                    return r.name.toLowerCase().includes(searchVal) || 
                           (r.address && r.address.toLowerCase().includes(searchVal)) ||
                           r.category.toLowerCase().includes(searchVal);
                }
                return true;
            });

            filtered.forEach(r => {
                const data = userUserData[r.id] || {};
                const isVisited = !!data.visited;

                const card = document.createElement('div');
                card.className = `michelin-card p-4 flex flex-col justify-between relative cursor-pointer`;
                card.onclick = () => openStampModal(r.id);

                const dateSection = data.date ? `<p class="text-[11px] text-michelin-subtext mt-1.5"><i class="fa-regular fa-calendar text-michelin-red mr-1"></i>${data.date}</p>` : '';

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-1.5 mb-2">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-gray-100 text-gray-700">${r.category}</span>
                            ${isVisited ? '<span class="text-[11px] text-michelin-red font-bold flex items-center gap-1"><i class="fa-solid fa-certificate"></i> VISITED</span>' : ''}
                        </div>
                        <h3 class="font-bold text-sm text-gray-900 font-serif leading-snug">${r.name}</h3>
                        ${r.address ? `<p class="text-xs text-michelin-subtext mt-2"><i class="fa-solid fa-location-dot text-gray-400 mr-1"></i>${r.address}</p>` : ''}
                        ${r.tel ? `<p class="text-xs text-michelin-subtext mt-0.5"><i class="fa-solid fa-phone text-gray-400 mr-1"></i>${r.tel}</p>` : ''}
                        ${dateSection}
                    </div>

                    <div class="mt-4 pt-2.5 border-t border-gray-100 flex justify-between items-center">
                        <a href="${r.tabelog}" target="_blank" onclick="event.stopPropagation()" class="text-xs text-michelin-red hover:underline flex items-center gap-1 font-semibold">
                            食べログ <i class="fa-solid fa-external-link text-[10px]"></i>
                        </a>
                        ${isVisited ? 
                            `<div class="w-8 h-8 rounded-full bg-michelin-red text-white flex items-center justify-center text-[9px] font-bold tracking-tighter shadow-sm">SAVORED</div>` : 
                            `<div class="w-7 h-7 rounded-full border border-dashed border-gray-300 flex items-center justify-center text-gray-400 text-[10px]">未</div>`
                        }
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function setFilter(type) {
            if (window.appState) window.appState.currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('filter-btn-active'));
            const activeBtn = document.getElementById(`btn-${type}`);
            if (activeBtn) activeBtn.classList.add('filter-btn-active');
            renderGrid();
        }

        function updateProgress() {
            const allRestaurants = getAllRestaurants();
            const total = allRestaurants.length;
            let visitedCount = 0;
            const userUserData = window.appState ? window.appState.userUserData : {};

            allRestaurants.forEach(r => {
                if (userUserData[r.id] && userUserData[r.id].visited) visitedCount++;
            });

            const pct = total > 0 ? Math.round((visitedCount / total) * 100) : 0;
            document.getElementById('visitedCountText').innerText = `${visitedCount} / ${total}`;
            document.getElementById('progressBar').style.width = `${pct}%`;
        }

        function openCategoryModal() {
            renderCategoryManagementList();
            document.getElementById('categoryModal').classList.remove('hidden');
        }

        function renderCategoryManagementList() {
            const container = document.getElementById('categoryListContainer');
            const cats = window.appState ? window.appState.categoriesList : [];
            container.innerHTML = cats.map((cat, idx) => `
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg border border-michelin-border text-xs">
                    <span class="font-medium text-gray-800">${cat}</span>
                    <button onclick="removeCategory(${idx})" class="text-red-500 hover:text-red-700 text-xs px-1.5 py-0.5">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `).join('');
        }

        function addCategory(e) {
            e.preventDefault();
            const input = document.getElementById('newCategoryInput');
            const name = input.value.trim();
            if (name && !window.appState.categoriesList.includes(name)) {
                window.appState.categoriesList.push(name);
                window.saveToCloud();
                input.value = '';
                renderCategoryManagementList();
            }
        }

        function removeCategory(idx) {
            if (confirm(`カテゴリー「${window.appState.categoriesList[idx]}」を削除しますか？`)) {
                window.appState.categoriesList.splice(idx, 1);
                window.saveToCloud();
                renderCategoryManagementList();
            }
        }

        function openStampModal(id) {
            const allRestaurants = getAllRestaurants();
            const r = allRestaurants.find(x => x.id === id);
            const data = (window.appState && window.appState.userUserData[id]) || {};

            document.getElementById('modalRestaurantId').value = id;
            document.getElementById('modalTitle').innerText = r.name;
            document.getElementById('modalCategory').innerText = r.category;
            document.getElementById('modalAddress').innerText = r.address || '住所未登録';
            document.getElementById('modalTel').innerText = r.tel || '電話番号未登録';
            
            const tabelogBtn = document.getElementById('modalTabelog');
            if (r.tabelog) {
                tabelogBtn.href = r.tabelog;
                tabelogBtn.classList.remove('hidden');
            } else {
                tabelogBtn.classList.add('hidden');
            }

            document.getElementById('modalVisited').checked = !!data.visited;
            document.getElementById('modalDate').value = data.date || '';
            document.getElementById('modalNotes').value = data.notes || '';

            const btnDelete = document.getElementById('btnDeleteCustom');
            if (r.id > 1000) {
                btnDelete.classList.remove('hidden');
            } else {
                btnDelete.classList.add('hidden');
            }

            toggleVisitedUI();
            document.getElementById('stampModal').classList.remove('hidden');
        }

        function openAddRestaurantModal() {
            document.getElementById('addRestaurantModal').classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        function toggleVisitedUI() {
            const isChecked = document.getElementById('modalVisited').checked;
            const visitedFields = document.getElementById('visitedFields');
            if (isChecked) {
                visitedFields.classList.remove('opacity-40', 'pointer-events-none');
            } else {
                visitedFields.classList.add('opacity-40', 'pointer-events-none');
            }
        }

        function saveStamp(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('modalRestaurantId').value);
            const isVisited = document.getElementById('modalVisited').checked;

            window.appState.userUserData[id] = {
                visited: isVisited,
                date: document.getElementById('modalDate').value,
                notes: document.getElementById('modalNotes').value
            };

            window.saveToCloud();
            closeModal('stampModal');
        }

        function addNewRestaurant(e) {
            e.preventDefault();
            
            const newRes = {
                id: Date.now(),
                name: document.getElementById('addName').value,
                category: document.getElementById('addCategory').value,
                address: document.getElementById('addAddress').value,
                tel: document.getElementById('addTel').value,
                tabelog: document.getElementById('addTabelog').value || '#'
            };

            window.appState.customRestaurants.push(newRes);
            window.saveToCloud();

            e.target.reset();
            closeModal('addRestaurantModal');
        }

        function deleteCustomRestaurant() {
            const id = parseInt(document.getElementById('modalRestaurantId').value);
            if (!confirm('このお店を削除しますか？')) return;

            window.appState.customRestaurants = window.appState.customRestaurants.filter(x => x.id !== id);
            delete window.appState.userUserData[id];
            
            window.saveToCloud();
            closeModal('stampModal');
        }
    </script>
</body>
</html>
